$kind: http-request
url: "{{baseUrl}}/api/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Carla Postman",
      "telefone": "(11) 97777-3333",
      "email": "carla.postman@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('clienteCriadoId', pm.response.json().dados.id);
order: 3000
