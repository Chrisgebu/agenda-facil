<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Cadastro e pesquisa de clientes do AgendaFácil.">
    <title>AgendaFácil - Clientes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/comum.js" defer></script>
    <script src="js/clientes.js" defer></script>
  </head>
  <body>
    <header>
      <div class="topo-conteudo">
        <h1>AgendaFácil</h1>
        <nav aria-label="Navegação principal">
          <ul>
            <li><a href="index.html">Agenda</a></li>
            <li><a href="agendamento.html">Novo agendamento</a></li>
            <li><a href="clientes.html" aria-current="page">Clientes</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite" hidden></p>
      <noscript><p>Ative o JavaScript no navegador para cadastrar e pesquisar clientes.</p></noscript>
      <section class="painel" aria-labelledby="titulo-clientes">
        <h2 id="titulo-clientes">Clientes cadastrados</h2>
        <p>
          <label for="busca-cliente">Pesquisar por nome</label>
          <input id="busca-cliente" type="search" placeholder="Digite parte do nome" maxlength="80">
        </p>
        <p id="resumo-clientes" aria-live="polite"></p>
        <div id="lista-clientes" class="lista-registros"></div>
      </section>

      <section class="painel" aria-labelledby="titulo-cadastro">
        <h2 id="titulo-cadastro">Novo cliente</h2>
        <form id="form-cliente" class="formulario" action="#" method="post" novalidate>
          <p>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required minlength="2" maxlength="80" autocomplete="name">
          </p>
          <p>
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" required maxlength="20" autocomplete="tel">
          </p>
          <p>
            <label for="email">E-mail (opcional)</label>
            <input id="email" name="email" type="email" maxlength="120" autocomplete="email">
          </p>
          <p class="acoes-formulario">
            <button type="submit">Salvar cliente</button>
            <button type="reset">Limpar campos</button>
          </p>
        </form>
        <p>Informe o telefone com DDD. Os cadastros ficam salvos neste navegador.</p>
      </section>
    </main>

    <footer>
      <p>AgendaFácil - protótipo de agendamentos.</p>
    </footer>
  </body>
</html>
